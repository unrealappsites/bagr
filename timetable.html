<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Timetable — Bagr</title>
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="icon" href="logo-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagr">
<meta name="theme-color" content="#171B24">
<link rel="stylesheet" href="shared.css?v=4">
<style>
  .day-col h2 { font-family: var(--mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate); margin-bottom: 0.75rem; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1rem; }
  @media (max-width: 900px) { .week-grid { grid-template-columns: 1fr; } }
  .slot { border: 2px solid var(--ink); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 0.75rem; background: white; position: relative; }
  .slot-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; padding-right: 1.5rem; }
  .slot-delete {
    position: absolute; top: 0.5rem; right: 0.5rem;
    background: none; border: none; color: var(--slate); font-size: 1rem;
    line-height: 1; cursor: pointer; padding: 0.2rem;
  }
  .slot-delete:hover { color: var(--stamp); }
  .slot-items { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .item-chip {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-family: var(--mono); font-size: 0.72rem; color: var(--ink);
    background: var(--paper-dim); border-radius: 999px; padding: 0.2rem 0.5rem 0.2rem 0.6rem;
  }
  .item-chip button {
    background: none; border: none; color: var(--slate); cursor: pointer;
    font-size: 0.85rem; line-height: 1; padding: 0;
  }
  .item-chip button:hover { color: var(--stamp); }
  .no-items { font-family: var(--mono); font-size: 0.75rem; color: var(--slate); }
  .add-slot-btn { width: 100%; border: 2px dashed var(--slate); background: transparent; border-radius: var(--radius); padding: 0.6rem; font-size: 0.8rem; color: var(--slate); }
  .add-slot-btn:hover { border-color: var(--ink); color: var(--ink); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,24,31,0.5); display: none; align-items: center; justify-content: center; padding: 1.5rem; z-index: 10; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); padding: 1.75rem; max-width: 420px; width: 100%; }
  .modal h3 { margin-bottom: 1rem; }
  .modal label { display: block; font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; margin: 1rem 0 0.4rem; color: var(--slate); }
  .modal input, .modal select { width: 100%; padding: 0.6rem; border: 2px solid var(--ink); border-radius: var(--radius); font-family: var(--body); }
  .week-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.75rem; }
  .week-tab {
    font-family: var(--mono); font-size: 0.8rem; text-transform: uppercase;
    padding: 0.5rem 1rem; border: 2px solid var(--ink); border-radius: 999px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .week-tab.active { background: var(--amber); }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }

  #nl-entry-card {
    position: relative;
    background: linear-gradient(180deg, rgba(232,163,60,0.08), rgba(232,163,60,0) 60%);
    border-color: var(--ink);
    overflow: hidden;
  }
  #nl-entry-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--amber), transparent 85%);
  }
  #nl-entry-card .nl-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem; }
  #nl-entry-card .nl-sparkle { flex-shrink: 0; color: var(--amber); }
  #nl-entry-card h3 { font-size: 1rem; margin: 0; }
  #nl-entry-card .nl-tag {
    font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.06em; background: var(--amber); color: var(--ink);
    padding: 0.1rem 0.45rem; border-radius: 999px; margin-left: 0.15rem;
  }
  #nl-entry-card .nl-subcopy { font-size: 0.85rem; color: var(--slate); margin: 0.35rem 0 0.9rem; }
  #nl-entry-card textarea {
    width: 100%; min-height: 74px; padding: 0.75rem; border: 2px solid var(--ink);
    border-radius: var(--radius); font-family: var(--body); font-size: 0.95rem;
    resize: vertical; background: var(--paper); transition: border-color 0.15s ease;
  }
  #nl-entry-card textarea:focus { outline: none; border-color: var(--amber); }
  #nl-entry-card .nl-examples { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
  #nl-entry-card .nl-example-chip {
    font-family: var(--mono); font-size: 0.72rem; color: var(--slate);
    background: var(--paper-dim); border: 1px solid transparent; border-radius: 999px;
    padding: 0.3rem 0.65rem; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease;
  }
  #nl-entry-card .nl-example-chip:hover { border-color: var(--amber); color: var(--ink); }
  #nl-entry-card .nl-actions { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; }
  #nl-entry-card .nl-parse-btn { display: inline-flex; align-items: center; gap: 0.45rem; }
  #nl-entry-card .nl-parse-btn .nl-sparkle { color: var(--ink); }
  #nl-entry-card .nl-parse-btn:disabled { opacity: 0.7; cursor: default; }
  #nl-entry-card .nl-spin { animation: nl-spin 0.8s linear infinite; }
  @keyframes nl-spin { to { transform: rotate(360deg); } }
  #nl-entry-card .nl-status {
    font-size: 0.85rem; color: var(--slate); display: flex; align-items: center; gap: 0.4rem;
  }
  #nl-entry-card .nl-status.error { color: var(--stamp); }
  #nl-entry-card .nl-locked { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }
  #nl-entry-card .nl-locked a { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav"></nav>

  <main class="app-main">
    <h1 style="font-size:1.8rem; margin-bottom:0.4rem;">Your timetable</h1>
    <p class="label" style="margin-bottom:1.25rem;">what recurs, and what it requires</p>

    <div id="nl-entry-card" class="card" style="max-width:640px; margin-bottom:1.5rem;"><!-- populated by JS --></div>

    <div class="week-tabs" id="week-tabs" style="display:none;"></div>

    <div class="week-grid" id="week-grid"><!-- populated by JS --></div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3>New slot</h3>
    <label for="slot-label-input">Label</label>
    <input id="slot-label-input" placeholder="e.g. Chemistry — Period 3">
    <label for="slot-items-input">Required items (comma separated)</label>
    <input id="slot-items-input" placeholder="Calculator, Lab coat, Textbook">
    <div class="modal-actions">
      <button class="btn outline" onclick="closeModal()">Cancel</button>
      <button class="btn amber" onclick="saveSlot()">Add slot</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js?v=4"></script>
<script>
let session, allSlots = [], allItems = [], profile = null, activeDay = 0, activeWeekTab = null;

async function init() {
  session = await requireSession();
  if (!session) return;
  renderDrawerNav('timetable');
  const userId = session.user.id;
  [allSlots, allItems, profile] = await Promise.all([fetchSlots(userId), fetchItems(userId), fetchProfile(userId)]);

  renderWeekTabs();
  renderNlEntryCard();
  render();
}

function renderWeekTabs() {
  if (profile && profile.has_ab_weeks) {
    document.getElementById('week-tabs').style.display = 'flex';
    document.getElementById('week-tabs').innerHTML = `
      <button class="week-tab active" onclick="setWeekTab(null, this)">Both weeks</button>
      <button class="week-tab" onclick="setWeekTab('A', this)">Week A</button>
      <button class="week-tab" onclick="setWeekTab('B', this)">Week B</button>
    `;
  } else {
    document.getElementById('week-tabs').style.display = 'none';
  }
}

function setWeekTab(letter, btn) {
  activeWeekTab = letter;
  document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('week-grid');
  grid.innerHTML = DAYS.map((day, idx) => `
    <div class="day-col">
      <h2>${day}</h2>
      ${allSlots.filter(s => s.day_of_week === idx && (!profile?.has_ab_weeks || s.week === activeWeekTab)).map(slotHtml).join('')}
      <button class="add-slot-btn" onclick="openModal(${idx})">+ Add slot</button>
    </div>
  `).join('');
}

function slotHtml(slot) {
  const chips = (slot.required_item_ids || [])
    .map(id => allItems.find(i => i.id === id))
    .filter(Boolean)
    .map(item => `
      <span class="item-chip">
        ${item.name}
        <button onclick="removeItemFromSlot(${slot.id}, ${item.id})" aria-label="Remove ${item.name}">&times;</button>
      </span>`)
    .join('');
  return `
    <div class="slot">
      <button class="slot-delete" onclick="deleteSlot(${slot.id})" aria-label="Delete slot">&times;</button>
      <div class="slot-label">${slot.label}</div>
      <div class="slot-items">${chips || '<span class="no-items">No items set</span>'}</div>
    </div>`;
}

async function deleteSlot(slotId) {
  if (!confirm('Delete this slot?')) return;
  const { error } = await sb.from('slots').delete().eq('id', slotId);
  if (error) { console.error(error); return; }
  allSlots = allSlots.filter(s => s.id !== slotId);
  render();
}

async function removeItemFromSlot(slotId, itemId) {
  const slot = allSlots.find(s => s.id === slotId);
  if (!slot) return;
  const newIds = (slot.required_item_ids || []).filter(id => id !== itemId);
  const { error } = await sb.from('slots').update({ required_item_ids: newIds }).eq('id', slotId);
  if (error) { console.error(error); return; }
  slot.required_item_ids = newIds;
  render();
}

function openModal(dayIdx) {
  activeDay = dayIdx;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('slot-label-input').value = '';
  document.getElementById('slot-items-input').value = '';
}

async function saveSlot() {
  const label = document.getElementById('slot-label-input').value.trim();
  const itemNames = document.getElementById('slot-items-input').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!label) return;

  // Upsert any new item names, collect ids
  const itemIds = [];
  for (const name of itemNames) {
    let existing = allItems.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (!existing) {
      const { data, error } = await sb.from('items')
        .insert({ user_id: session.user.id, name, location: 'home' })
        .select().single();
      if (error) { console.error(error); continue; }
      existing = data;
      allItems.push(existing);
    }
    itemIds.push(existing.id);
  }

  const { data, error } = await sb.from('slots')
    .insert({
      user_id: session.user.id,
      day_of_week: activeDay,
      week: profile?.has_ab_weeks ? activeWeekTab : null,
      label,
      required_item_ids: itemIds
    })
    .select().single();
  if (error) { console.error(error); return; }
  allSlots.push(data);
  closeModal();
  render();
}

// Bagr Ultimate — natural-language timetable setup. This function only
// PROPOSES a slot (via parse-timetable-entry, a free Hugging Face call) —
// it never writes anything itself. It prefills the existing "New slot"
// modal with what got parsed, so the person still reviews and confirms
// (or edits) before saveSlot() actually writes to the database, exactly
// the same path as adding a slot manually.
async function renderNlEntryCard() {
  const card = document.getElementById('nl-entry-card');
  const { data: sub } = await sb.from('subscriptions').select('tier').eq('user_id', session.user.id).maybeSingle();

  const sparkleSvg = `<svg class="nl-sparkle" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 3.4 2.4 5.4 6 6-3.6.6-5.4 2.6-6 6-.6-3.4-2.4-5.4-6-6 3.6-.6 5.4-2.6 6-6z"/></svg>`;

  if (!sub || sub.tier !== 'ultimate') {
    card.innerHTML = `
      <div class="nl-locked">
        ${sparkleSvg}
        <span>Describe your week in plain English and let Bagr build the slot for you — that's a <a href="upgrade.html">Bagr Ultimate</a> feature.</span>
      </div>`;
    return;
  }

  card.innerHTML = `
    <div class="nl-header">
      ${sparkleSvg}
      <h3>Describe a slot</h3>
      <span class="nl-tag">Ultimate</span>
    </div>
    <p class="nl-subcopy">Type it like you'd tell a friend — Bagr figures out the day, whether it alternates, and what you need.</p>
    <textarea id="nl-text-input" placeholder="e.g. every other Tuesday I have football, need shin pads and a water bottle"></textarea>
    <div class="nl-examples">
      <button type="button" class="nl-example-chip" onclick="useNlExample(this)">gym Mondays and Thursdays, trainers and a towel</button>
      <button type="button" class="nl-example-chip" onclick="useNlExample(this)">swimming every Friday, need goggles</button>
      <button type="button" class="nl-example-chip" onclick="useNlExample(this)">every other Wednesday, orchestra — bring my violin</button>
    </div>
    <div class="nl-actions">
      <button class="btn amber nl-parse-btn" id="nl-parse-btn" onclick="parseTimetableEntry()">
        ${sparkleSvg}<span id="nl-parse-btn-label">Parse with AI</span>
      </button>
      <span class="nl-status" id="nl-status"></span>
    </div>`;
}

function useNlExample(btn) {
  document.getElementById('nl-text-input').value = btn.textContent;
  document.getElementById('nl-text-input').focus();
}

async function parseTimetableEntry() {
  const input = document.getElementById('nl-text-input');
  const status = document.getElementById('nl-status');
  const btn = document.getElementById('nl-parse-btn');
  const text = input.value.trim();
  if (!text) return;

  const idleBtnHtml = btn.innerHTML;
  btn.disabled = true;
  const spinSvg = `<svg class="nl-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>`;
  btn.innerHTML = `${spinSvg}<span>Reading that…</span>`;
  status.className = 'nl-status';
  status.textContent = '';

  const resetButton = () => { btn.disabled = false; btn.innerHTML = idleBtnHtml; };

  try {
    const { data, error } = await sb.functions.invoke('parse-timetable-entry', { body: { text } });
    if (error) throw error;

    if (!data.entitled) {
      status.className = 'nl-status error';
      status.textContent = "That's a Bagr Ultimate feature — head to the Upgrade tab.";
      resetButton();
      return;
    }
    if (data.error) {
      status.className = 'nl-status error';
      status.textContent = data.error;
      resetButton();
      return;
    }

    // Enable A/B weeks on the fly if this is the first alternating slot
    // anyone's described, so the parsed result actually has somewhere to go.
    if (data.alternating && !profile?.has_ab_weeks) {
      const { data: updated, error: profErr } = await sb.from('profiles')
        .update({ has_ab_weeks: true, ab_reference_date: new Date().toISOString().slice(0, 10), ab_reference_week: 'A' })
        .eq('user_id', session.user.id)
        .select().single();
      if (!profErr) {
        profile = updated;
        renderWeekTabs();
      }
    }

    if (profile?.has_ab_weeks) {
      activeWeekTab = data.alternating ? 'A' : null;
      document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
      const targetLabel = data.alternating ? 'Week A' : 'Both weeks';
      const targetBtn = [...document.querySelectorAll('.week-tab')].find(b => b.textContent.trim() === targetLabel);
      if (targetBtn) targetBtn.classList.add('active');
    }
    render();

    openModal(data.day_of_week);
    document.getElementById('slot-label-input').value = data.label;
    document.getElementById('slot-items-input').value = data.items.join(', ');

    // Clean slate for next time — safe to fully rebuild since the modal now
    // holds everything the person needs to see.
    renderNlEntryCard();
  } catch (err) {
    status.className = 'nl-status error';
    status.textContent = "Couldn't reach the parser — try again, or add it manually below.";
    resetButton();
  }
}

init();
</script>
</body>
</html>
